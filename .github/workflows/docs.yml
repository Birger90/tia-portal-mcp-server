name: Docs

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths: &docs-paths
      - "docs/**"
      - "**/*.md"
      - ".gitattributes"
      - "scripts/verify-docs.py"
      - "scripts/tests/**"
      - "scripts/timing/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main"]
    paths: *docs-paths

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The archive tag lives in the upstream repository (Czarnak/tia-portal-mcp); this fork has no
      # common history with it, so the tag is fetched from there before the archive links are checked.
      - name: Fetch the upstream docs archive tag
        run: git fetch --no-tags https://github.com/Czarnak/tia-portal-mcp.git refs/tags/docs-archive-2026-10-30:refs/tags/docs-archive-2026-10-30

      - name: Test the checker
        run: python3 -I scripts/tests/test_verify_docs.py

      - name: Test the timing script
        run: python3 -I scripts/timing/test_measure_write_timing.py

      - name: Verify docs
        run: >
          python3 -I scripts/verify-docs.py
          --archive-tag docs-archive-2026-10-30
          --bilingual
          ${{ github.event_name == 'push' && '--fail-on-transient' || '' }}
